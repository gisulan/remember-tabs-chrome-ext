# Publishes a GitHub Release with the extension zip and notes from CHANGELOG.md.
#
# Two ways to start it:
#  - On github.com: Actions tab → "Release" → "Run workflow" (branch: main).
#    It releases the version in manifest.json and creates the vX.Y.Z tag itself.
#  - Pushing a vX.Y.Z tag from git.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is already released. Bump \"version\" in manifest.json and add a '## v<new version>' section to CHANGELOG.md first."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if [ "v$VERSION" != "$TAG" ]; then
              echo "::error::Tag is $TAG but manifest.json version is $VERSION. Bump the version or fix the tag."
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the extension zip
        run: ./scripts/build-release.sh

      - name: Write release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '$1=="##" { if (found) exit; if ($2==tag) { found=1; next } } found' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## $TAG' section. Add one describing this version."
            exit 1
          fi
          sed "s/{{VERSION}}/${TAG#v}/g" .github/release-footer.md >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/remember-tabs-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release was already created by hand on github.com: just attach the zip,
            # and fill in the notes if its description was left empty.
            gh release upload "$TAG" "$ZIP" --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "$ZIP" \
              --title "Remember Tabs $TAG" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
