# Publishes a GitHub Release when a version tag (e.g. v1.2.0) is pushed.
# The release gets the zip built by scripts/build-release.sh and the notes
# from that version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but manifest.json version is $VERSION. Bump the version or fix the tag."
            exit 1
          fi

      - name: Build the extension zip
        run: ./scripts/build-release.sh

      - name: Write release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '$1=="##" { if (found) exit; if ($2==tag) { found=1; next } } found' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section."
            exit 1
          fi
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" .github/release-footer.md >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/remember-tabs-$GITHUB_REF_NAME.zip" \
            --title "Remember Tabs $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
